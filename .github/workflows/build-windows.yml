name: Build Windows exe

# 每次 push 會自動跑；也可以在 GitHub 的 Actions 分頁手動按 "Run workflow"
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build SangerScanner.exe
        run: >
          pyinstaller --onefile --windowed --name SangerScanner
          --hidden-import=Bio.SeqIO.AbiIO
          --collect-submodules=Bio
          --exclude-module=PyQt5
          --exclude-module=PyQt6
          --exclude-module=PySide2
          --exclude-module=PySide6
          --exclude-module=IPython
          --exclude-module=notebook
          ab1_gui.py

      - name: Upload exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SangerScanner-windows
          path: dist/SangerScanner.exe
          if-no-files-found: error
